<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · Linkora</title>
  <meta name="description" content="Connect. Share. Grow. View user profile and posts on Linkora.">
  <meta name="theme-color" content="#F7F7FB">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">

  <!-- Open Graph -->
  <meta property="og:title" content="Profile · Linkora">
  <meta property="og:description" content="Connect. Share. Grow. The vibrant social network for creators.">
  <meta property="og:image" content="/assets/og-image.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <!-- Sticky Top Navbar -->
  <div id="navbar-mount"></div>

  <!-- Main 3-Column Responsive Layout -->
  <div class="app-layout">
    <main class="app-container">
      <!-- Left Column: Navigation Sidebar (Desktop) -->
      <aside class="left-sidebar" id="left-sidebar-mount" aria-label="Main Navigation">
        <!-- Rendered dynamically by nav.js -->
      </aside>

      <!-- Center Column: Profile Header & User Stream -->
      <section class="main-feed-column" id="profile-content-mount" aria-label="User Profile">
        <!-- Profile Header Mount -->
        <div id="profile-header-mount"></div>

        <!-- User Posts Mount -->
        <section id="profile-posts-mount" aria-label="User Posts Stream"></section>
      </section>

      <!-- Right Column: Trending & Who to Follow (Desktop) -->
      <aside class="right-sidebar" aria-label="Trending and Suggested">
        <!-- Rendered dynamically by nav.js -->
      </aside>
    </main>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="card modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Edit Profile</h2>
        <button type="button" class="btn-close-modal" id="btn-close-edit-modal" title="Close">✕</button>
      </div>

      <form id="edit-profile-form" style="padding: var(--space-3);">
        <div class="form-group">
          <label class="form-label" for="edit-bio">Bio</label>
          <textarea 
            id="edit-bio" 
            class="textarea-field" 
            rows="3" 
            placeholder="Tell the community about yourself..." 
            maxlength="300"
            style="resize: none;"
          ></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-avatar-url">Avatar Image URL</label>
          <input 
            type="url" 
            id="edit-avatar-url" 
            class="input-field" 
            placeholder="https://example.com/avatar.jpg" 
          />
          <small style="color: var(--text-faint); font-size: 11px; display: block; margin-top: 4px;">
            Leave empty to use automatic initials avatar.
          </small>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: var(--space-1); margin-top: var(--space-3);">
          <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-edit-modal">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary btn-sm" id="btn-save-profile">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Followers / Following List Modal -->
  <div class="modal-overlay" id="users-list-modal">
    <div class="card modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="users-modal-title">Users</h2>
        <button type="button" class="btn-close-modal" id="btn-close-users-modal" title="Close">✕</button>
      </div>
      <div id="users-modal-content" style="max-height: 420px; overflow-y: auto; padding: var(--space-2);"></div>
    </div>
  </div>

  <!-- Shared Footer -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/feed.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
