<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Linkora</title>
  <meta name="description" content="Connect. Share. Grow. Sign in to your Linkora account.">
  <meta name="theme-color" content="#0F172A">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">

  <!-- Open Graph -->
  <meta property="og:title" content="Sign In · Linkora">
  <meta property="og:description" content="Connect. Share. Grow. A minimalist community for builders and creators.">
  <meta property="og:image" content="/assets/og-image.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <!-- Global Shared Navbar Mount -->
  <div id="navbar-mount"></div>

  <main class="auth-wrapper">
    <div class="card auth-card">
      <div class="auth-header">
        <a href="/" title="Linkora">
          <img src="/assets/logo.svg" alt="Linkora" class="auth-logo" />
        </a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Connect. Share. Grow.</p>
      </div>

      <!-- Inline Error Message -->
      <div class="input-error-msg" id="login-error-msg" style="margin-bottom: var(--space-4); text-align: center;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">Username or Email</label>
          <input 
            type="text" 
            id="login-identifier" 
            class="input-field" 
            placeholder="e.g. alex_dev or alex@codealpha.dev" 
            required 
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="login-password" 
              class="input-field" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            />
            <button type="button" class="btn-toggle-password" data-target="login-password" aria-label="Show password">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%; margin-top: var(--space-2); padding: 10px;">
          Sign In
        </button>
      </form>

      <!-- Secondary Demo Users Box -->
      <div class="demo-users-box">
        <div class="demo-title">Try a demo account</div>
        <div class="demo-chips">
          <button type="button" class="demo-chip" data-username="alex_dev">alex_dev</button>
          <button type="button" class="demo-chip" data-username="sarah_design">sarah_design</button>
          <button type="button" class="demo-chip" data-username="marcus_tech">marcus_tech</button>
        </div>
      </div>

      <p style="text-align: center; margin-top: var(--space-6); font-size: var(--font-xs); color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 500;">Create an account</a>
      </p>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
