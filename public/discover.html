<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore · Linkora</title>
  <meta name="description" content="Connect. Share. Grow. Discover creators, developers, and designers on Linkora.">
  <meta name="theme-color" content="#F7F7FB">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">

  <!-- Open Graph -->
  <meta property="og:title" content="Explore · Linkora">
  <meta property="og:description" content="Connect. Share. Grow. The vibrant social network for creators.">
  <meta property="og:image" content="/assets/og-image.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <!-- Sticky Top Navbar -->
  <div id="navbar-mount"></div>

  <!-- Main 3-Column Responsive Layout -->
  <div class="app-layout">
    <main class="app-container">
      <!-- Left Column: Navigation Sidebar (Desktop) -->
      <aside class="left-sidebar" id="left-sidebar-mount" aria-label="Main Navigation">
        <!-- Rendered dynamically by nav.js -->
      </aside>

      <!-- Center Column: Discover Hero & Creators Grid -->
      <section class="main-feed-column" aria-label="Discover Creators">
        <!-- Discover Hero & Search Box -->
        <div class="card discover-hero" style="padding: var(--space-4); text-align: center;">
          <h1 style="font-size: var(--font-2xl); font-weight: 800; margin-bottom: 6px;">
            Explore <span class="gradient-text">Creators & Topics</span>
          </h1>
          <p style="font-size: var(--font-sm); color: var(--text-muted); margin-bottom: var(--space-3);">
            Find inspiring engineers, designers, and thinkers across the community
          </p>

          <div class="search-input-wrap" style="max-width: 480px; margin: 0 auto;">
            <span class="search-input-icon">
              <svg class="lucide lucide-search" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="search-users-input" 
              class="search-input-field" 
              placeholder="Search by username or bio (e.g. dev, design, react)..." 
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Creators Grid -->
        <section class="discover-grid" id="discover-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-2-5);" aria-label="Creators List"></section>
      </section>

      <!-- Right Column: Trending & Who to Follow (Desktop) -->
      <aside class="right-sidebar" aria-label="Trending and Suggested">
        <!-- Rendered dynamically by nav.js -->
      </aside>
    </main>
  </div>

  <!-- Shared Footer -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/discover.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
