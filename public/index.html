<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed · Linkora</title>
  <meta name="description" content="Connect. Share. Grow. The vibrant social network for creators.">
  <meta name="theme-color" content="#F7F7FB">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="/assets/favicon.ico">

  <!-- Open Graph -->
  <meta property="og:title" content="Feed · Linkora">
  <meta property="og:description" content="Connect. Share. Grow. The vibrant social network for creators.">
  <meta property="og:image" content="/assets/og-image.png">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <!-- Sticky Top Navbar -->
  <div id="navbar-mount"></div>

  <!-- Landing Hero Mount for Logged-Out Visitors -->
  <div id="landing-hero-mount" style="max-width: 1200px; margin: var(--space-4) auto 0; padding: 0 var(--space-3); display: none;"></div>

  <!-- Main 3-Column Responsive Layout -->
  <div class="app-layout">
    <main class="app-container">
      <!-- Left Column: Navigation Sidebar (Desktop) -->
      <aside class="left-sidebar" id="left-sidebar-mount" aria-label="Main Navigation">
        <!-- Rendered dynamically by nav.js -->
      </aside>

      <!-- Center Column: Post Composer & Feed Stream -->
      <section class="main-feed-column" aria-label="Main Stream">
        <!-- Post Composer Card -->
        <div class="card composer-card" id="post-composer" style="padding: var(--space-3);">
          <div style="display: flex; gap: 12px; margin-bottom: 12px;">
            <div id="composer-avatar-mount"></div>
            <div style="flex: 1;">
              <textarea 
                id="post-content" 
                class="textarea-field" 
                placeholder="What are you building or thinking about today?" 
                maxlength="280"
                rows="3"
                style="resize: none;"
              ></textarea>

              <!-- Image URL Input (collapsible) -->
              <div id="image-input-wrap" style="display: none; margin-top: 10px;">
                <input 
                  type="url" 
                  id="post-image-url" 
                  class="input-field" 
                  placeholder="Paste an image URL (PNG, JPG, WebP)..." 
                />
              </div>

              <!-- Image Preview Container -->
              <div id="image-preview-wrap" style="display: none; position: relative; margin-top: 10px; border-radius: var(--radius-lg); overflow: hidden; max-height: 320px; background: var(--bg-surface-elevated);">
                <img id="image-preview" alt="Preview image" style="width: 100%; height: auto; max-height: 320px; object-fit: cover; display: block;" />
                <button type="button" id="btn-remove-preview" class="btn-icon" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; width: 28px; height: 28px;" title="Remove image">
                  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="16" height="16">
                    <path d="M18 6 6 18M6 6l12 12"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border-subtle);">
            <div style="display: flex; align-items: center; gap: 6px;">
              <button type="button" class="btn-icon" id="btn-toggle-image" title="Attach image URL">
                <svg class="lucide lucide-image" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" width="18" height="18">
                  <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
              </button>
            </div>

            <div style="display: flex; align-items: center; gap: 12px;">
              <span id="char-counter" style="font-size: var(--font-xs); color: var(--text-muted); font-weight: 500;">0/280</span>
              <button type="button" class="btn btn-primary btn-sm" id="btn-submit-post" disabled>
                Post
              </button>
            </div>
          </div>
        </div>

        <!-- Feed Stream Header & Filter Tabs -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin: var(--space-2) 0 var(--space-1);">
          <h1 class="feed-title" style="font-size: var(--font-xl); font-weight: 800;">Home Feed</h1>
          <div class="tabs-segmented feed-tabs">
            <button type="button" class="tab-segmented-btn active feed-tab" data-filter="">Following</button>
            <button type="button" class="tab-segmented-btn feed-tab" data-filter="all">Explore All</button>
          </div>
        </div>

        <!-- Posts Container -->
        <div id="feed-container"></div>
      </section>

      <!-- Right Column: Trending Hashtags & Who to Follow (Desktop) -->
      <aside class="right-sidebar" aria-label="Trending and Suggested">
        <!-- Rendered dynamically by nav.js -->
      </aside>
    </main>
  </div>

  <!-- Shared Footer -->
  <div id="footer-mount"></div>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/feed.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
